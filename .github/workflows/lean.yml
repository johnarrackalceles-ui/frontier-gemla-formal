name: Lean Formal Checks

on:
  push:
    paths:
      - "FrontierGEMLA/**"
      - "FrontierGEMLA.lean"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "lean-toolchain"
      - ".github/workflows/lean.yml"

  pull_request:
    paths:
      - "FrontierGEMLA/**"
      - "FrontierGEMLA.lean"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "lean-toolchain"
      - ".github/workflows/lean.yml"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
          axiom-audit: true
          axiom-audit-root: FrontierGEMLA
          axiom-audit-allow: "propext"

      - name: Enforce historical spike isolation
        shell: bash
        run: |
          if grep -REn \
            --include='*.lean' \
            --exclude-dir=Spike \
            '^[[:space:]]*import[[:space:]]+FrontierGEMLA\.Spike' \
            FrontierGEMLA
          then
            echo "ERROR: production modules must not import FrontierGEMLA.Spike.*"
            exit 1
          fi

      - name: Build historical and modular axiom reports
        run: |
          lake build FrontierGEMLA.Spike.AxiomReport
          lake build FrontierGEMLA.Ladder.AxiomReport

      - name: Compare historical and modular axiom baselines
        shell: bash
        run: |
          lake env lean FrontierGEMLA/Spike/AxiomReport.lean > /tmp/spike-axioms.txt
          lake env lean FrontierGEMLA/Ladder/AxiomReport.lean > /tmp/ladder-axioms.txt

          echo "Historical spike:"
          cat /tmp/spike-axioms.txt

          echo "Modular implementation:"
          cat /tmp/ladder-axioms.txt

          diff -u /tmp/spike-axioms.txt /tmp/ladder-axioms.txt