name: Lean Formal Checks

on:
  push:
    paths:
      - "FrontierGEMLA/**"
      - "FrontierGEMLA.lean"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "lean-toolchain"
      - ".github/workflows/lean.yml"
      - ".gitattributes"
      - "README.md"

  pull_request:
    paths:
      - "FrontierGEMLA/**"
      - "FrontierGEMLA.lean"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "lean-toolchain"
      - ".github/workflows/lean.yml"
      - ".gitattributes"
      - "README.md"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
          axiom-audit: true
          axiom-audit-root: FrontierGEMLA
          axiom-audit-allow: "propext"
      - name: Reject unfinished Lean proofs
        shell: bash
        run: |
          if grep -REn \
            --include='*.lean' \
            --exclude-dir='.lake' \
            '\b(sorry|admit)\b' \
            FrontierGEMLA FrontierGEMLA.lean
          then
            echo "ERROR: publication artifact contains sorry or admit"
            exit 1
          fi

      - name: Enforce historical spike isolation
        shell: bash
        run: |
          if grep -REn \
            --include='*.lean' \
            --exclude-dir=Spike \
            '^[[:space:]]*import[[:space:]]+FrontierGEMLA\.Spike' \
            FrontierGEMLA
          then
            echo "ERROR: production modules must not import FrontierGEMLA.Spike.*"
            exit 1
          fi

      - name: Build axiom reports
        run: |
          lake build FrontierGEMLA.Spike.AxiomReport
          lake build FrontierGEMLA.Ladder.SpikeParityReport
          lake build FrontierGEMLA.Ladder.AxiomReport

      - name: Compare historical spike with modular baseline
        shell: bash
        run: |
          lake env lean FrontierGEMLA/Spike/AxiomReport.lean > /tmp/spike-axioms.txt
          lake env lean FrontierGEMLA/Ladder/SpikeParityReport.lean > /tmp/parity-axioms.txt

          echo "Historical spike:"
          cat /tmp/spike-axioms.txt

          echo "Modular spike baseline:"
          cat /tmp/parity-axioms.txt

          diff -u /tmp/spike-axioms.txt /tmp/parity-axioms.txt

      - name: Print current modular axiom report
        run: lake env lean FrontierGEMLA/Ladder/AxiomReport.lean