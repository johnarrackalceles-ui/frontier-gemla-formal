name: Lean Formal Checks

on:
  push:
    paths:
      - "FrontierGEMLA/**"
      - "FrontierGEMLA.lean"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "lean-toolchain"
      - ".github/workflows/lean.yml"

  pull_request:
    paths:
      - "FrontierGEMLA/**"
      - "FrontierGEMLA.lean"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "lean-toolchain"
      - ".github/workflows/lean.yml"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
          use-mathlib-cache: false
          axiom-audit: true
          axiom-audit-root: FrontierGEMLA
          axiom-audit-allow: "propext"

      - name: Print theorem axioms
        run: lake env lean FrontierGEMLA/Spike/AxiomReport.lean